name: Test

on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - name: Install pnpm
      uses: pnpm/action-setup@v6
      with:
        version: 10
    - name: Set up Node
      uses: actions/setup-node@v7
      with:
        node-version-file: '.nvmrc'
        cache: 'pnpm'
    - name: Install Node dependencies
      run: pnpm install
    - name: Run tests
      run: pnpm test
